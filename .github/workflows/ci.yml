name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
        timeout-minutes: 2
      - run: npm ci
        timeout-minutes: 3
      - run: npm run check
        timeout-minutes: 4
      - name: Backend tests
        run: npm test -w backend
        timeout-minutes: 2
      - name: Frontend unit tests
        run: npm run test:unit -w frontend
        timeout-minutes: 2
      - name: Frontend Vite branding integration
        run: npm run test:branding -w frontend
        timeout-minutes: 3

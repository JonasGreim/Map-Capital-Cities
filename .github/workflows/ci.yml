name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capitals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capitals_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
        timeout-minutes: 2
      - run: npm ci
        timeout-minutes: 3
      - run: npm run check
        timeout-minutes: 4
      - name: Backend tests
        run: npm test -w backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/capitals_test
        timeout-minutes: 2
      - name: Frontend unit tests
        run: npm run test:unit -w frontend
        timeout-minutes: 2
      - name: Frontend Vite branding integration
        run: npm run test:branding -w frontend
        timeout-minutes: 3
